name: Build Theros AFK Keeper
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q TherosAFK.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Use the permanent signing key
        run: |
          mkdir -p ~/.android
          cp TherosAFK/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: TherosAFK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee ../build.log

      - name: Summarize errors
        if: failure()
        run: |
          {
            echo "## Build errors (short)"
            echo '```'
            sed -n '/\* What went wrong:/,/\* Try:/p' build.log | head -30
            echo "-----"
            grep -E "error:|FAILED|Execution failed" build.log | grep -v "Warning" | head -15
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        with:
          name: TherosAFK-apk
          path: TherosAFK/app/build/outputs/apk/debug/*.apk
          
